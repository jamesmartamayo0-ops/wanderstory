services:
  postgres:
    image: postgres:16
    container_name: wanderstory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wanderstory
      POSTGRES_PASSWORD: wanderstory_dev_password
      POSTGRES_DB: wanderstory
    ports:
      - "5432:5432"
    volumes:
      - wanderstory_pgdata:/var/lib/postgresql/data

volumes:
  wanderstory_pgdata: